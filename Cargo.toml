[package]
name = "nitpicker"
version = "0.10.1"
edition = "2024"
# MSRV of the default (azure-off) build. The optional `azure` feature raises the floor to 1.88
# via azure_core's own rust-version; cargo enforces that when `--features azure` is enabled.
rust-version = "1.85"
default-run = "nitpicker"
description = "Multi-reviewer code review using LLMs with parallel agents and debate mode"
license = "MIT"
repository = "https://github.com/arsenyinfo/nitpicker"
documentation = "https://github.com/arsenyinfo/nitpicker"
exclude = [
    "assets/",
    "slides.md",
    "nitpicker-presentation.pdf",
    "1b_tokens.png",
]

[[bin]]
name = "nitpicker"
path = "src/main.rs"

[workspace]
members = ["crates/nitpicker-agent"]

[dependencies]
nitpicker-agent = { path = "crates/nitpicker-agent", version = "0.5.4" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync", "net"] }
futures = "0.3"
rig-core = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
# indicatif already pulls this in; declared directly so the terminal-size query is explicit
console = "0.16"
termimad = "0.34"
toml = "1"
unicode-width = "0.2"

reqwest = { version = "0.13", features = ["json", "form"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
rand = "0.10"
base64 = "0.22"
url = "2"
tempfile = "3"
# OpenTelemetry trace export — opt-in, see the `otel` feature below
opentelemetry = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "internal-logs"], optional = true }
tracing-opentelemetry = { version = "0.33", default-features = false, optional = true }
# Antigravity Gemini proxy deps — opt-in, see the `antigravity` feature below
axum = { version = "0.8", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Enables `auth = "azure-ad"` for OpenAI/Anthropic providers (Azure AI Foundry).
# Forwards to the core crate's `azure` feature (which owns the Azure SDK deps). Build with `--features azure`.
azure = ["nitpicker-agent/azure"]
# Enables `auth = "agy-keyring"` (Antigravity Gemini via the local proxy in `src/gemini_proxy`).
# Off by default: pulls in axum + keyring (native crypto/secret-service backends) for the proxy
# server here, and forwards to the core crate's `antigravity` code-gate. Build with `--features antigravity`.
antigravity = ["nitpicker-agent/antigravity", "dep:axum", "dep:uuid", "dep:keyring"]
# Exports each run as an OpenTelemetry trace over OTLP/HTTP when `OTEL_EXPORTER_OTLP_ENDPOINT`
# is set. Binary-only: the core crate emits plain `tracing` spans unconditionally. Off by
# default: pulls in the OpenTelemetry SDK + protobuf codec. Build with `--features otel`.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

# thin LTO + opt-level "z" trims the binary (~12M → ~8.7M) while keeping clean release
# builds faster than the no-LTO default; codegen-units stays at the default 16 for build
# parallelism. panic stays "unwind" — review.rs catches reviewer-task panics as JoinError.
[profile.release]
opt-level = "z"
lto = "thin"
strip = true
